name: Publish

# Publica al crear un tag `v*` (por ejemplo `git tag v1.0.2 && git push --tags`).
# Usa "trusted publishing" de npm (OIDC): no necesita ningún token guardado.
# Configúralo una vez en npmjs.com → el paquete → Settings → Trusted Publisher:
#   Publisher: GitHub Actions · Organization/user: urtziDV · Repository: dsh-locale-es-ui
#   Workflow filename: publish.yml · Environment: (vacío)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish --provenance --access public
